name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: go test
        run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - name: Build example
        run: go build -o /tmp/payments-api ./examples/payments-api

  integration:
    name: integration (Redis 7)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: go test -tags integration
        run: go test -race -tags integration -count=1 -v -run 'Integration|LuaMatchesGo' ./redisstore
      - name: Benchmark against Redis
        run: go test -tags integration -run '^$' -bench Integration -benchtime 2000x ./redisstore

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Run every fuzz target for 15s
        run: |
          for pkg in $(go list ./...); do
            dir=$(go list -f '{{.Dir}}' "$pkg")
            for target in $(grep -ho '^func Fuzz[A-Za-z0-9_]*' "$dir"/*_test.go 2>/dev/null | sed 's/^func //'); do
              echo "::group::$pkg $target"
              go test -run='^$' -fuzz="^${target}\$" -fuzztime=15s -fuzzminimizetime=1s "$pkg"
              echo "::endgroup::"
            done
          done
